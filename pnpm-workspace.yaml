packages:
  # The library itself, and the docs site.
  - .
  - site

verifyDepsBeforeRun: error
enableGlobalVirtualStore: false

# Fail instead of silently adding `minimumReleaseAgeExclude` entries when a
# pinned version is newer than the minimum release age.
minimumReleaseAgeStrict: true

allowBuilds:
  dprint: false
  esbuild: false
